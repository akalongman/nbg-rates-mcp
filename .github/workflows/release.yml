name: Release

on:
  push:
    tags: ['v*']

# A tag push once started two runs in the same second (2026-10-12); the loser failed with a 409 from npm. A queued
# duplicate finds every step already done, because the publish script is idempotent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Installs and runs every dependency, so it gets no token that can publish.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run test:e2e
      - name: Check versions and the npm CLI
        run: npx tsx scripts/check-release.ts "${GITHUB_REF_NAME#v}"
      - name: Build and validate the MCPB bundle
        run: ./scripts/build-bundle.sh
      - name: Pack the npm tarball
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            nbg-rates-mcp-*.tgz
            nbg-rates-mcp-*.mcpb
          if-no-files-found: error

  # Holds the publishing tokens and runs no installed package: only npm, gh and the checksum-pinned mcp-publisher.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Publish to npm (trusted publishing, provenance automatic)
        run: ./scripts/publish-release.sh npm "${GITHUB_REF_NAME#v}"
      - name: Create the GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh github "${GITHUB_REF_NAME#v}"
      - name: Publish to the MCP registry
        run: ./scripts/publish-release.sh registry "${GITHUB_REF_NAME#v}"

  # Ships the build to the hosted endpoint. Skipped where the infrastructure's variables are absent (a fork).
  deploy:
    needs: publish
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Build the Lambda zip from the published tarball
        run: ./scripts/build-lambda.sh "${GITHUB_REF_NAME#v}"
      - name: Install the smoke test's client
        run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload, publish, move the alias and smoke test
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
          FUNCTION_ALIAS: ${{ vars.FUNCTION_ALIAS }}
          MCP_URL: ${{ vars.MCP_URL }}
        run: ./scripts/publish-release.sh lambda "${GITHUB_REF_NAME#v}"
